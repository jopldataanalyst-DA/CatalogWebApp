[phases.setup]
nixPkgs = ["nodejs", "python312"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r backend/requirements.txt",
  # package-lock.json was generated on Windows, so npm's optional-dependency
  # resolution (github.com/npm/cli/issues/4828) omits the Linux-x64 native
  # binaries for Tailwind v4's Rust engine (@tailwindcss/oxide) and its
  # CSS parser (lightningcss) - install them explicitly, same workaround
  # PricingModule's own root nixpacks.toml uses for @rolldown/binding.
  "cd frontend && npm install && npm install @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu --no-save"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "export PATH=/opt/venv/bin:$PATH && cd backend && uvicorn main:app --host 0.0.0.0 --port 8010"
